<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIAUSSÉ — Espace Admin & Statistiques</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--p:#0ea5e9;--pd:#0284c7;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#64748b;--border:#dbe3ee}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;padding:22px 16px}
.wrap{max-width:1100px;margin:auto;padding:0 16px}.brand{font-size:24px;font-weight:800}.sub{margin-top:5px;font-size:14px;opacity:.9}
.card,.shop,.stat{background:#fff;border:1px solid var(--border);border-radius:14px}
.card{padding:20px;margin-bottom:20px}
.stats-grid{display:grid;grid-template-columns:1fr 320px;gap:20px;margin:20px 0}
.kpi-boxes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{padding:18px;background:#fff;border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;justify-content:center}
.num{font-size:28px;font-weight:900;color:var(--p)}.lbl{font-size:13px;color:var(--muted);margin-top:4px}
.chart-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.chart-container{position:relative;width:100%;max-width:240px;height:240px}
.toolbar{display:flex;gap:10px;margin-bottom:15px}.toolbar input{flex:1;padding:12px;border:1px solid var(--border);border-radius:9px}
.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.secondary{background:#e8eef5;color:var(--text)}
.shop-list{display:grid;gap:12px}
.shop{padding:16px;background:#fff;border:1px solid var(--border);border-radius:14px;cursor:pointer}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.name{font-size:17px;font-weight:900}.meta{color:var(--muted);font-size:13px;margin-top:2px}
.shop-body{display:none;border-top:1px solid var(--border);margin-top:13px;padding-top:13px}
.shop.open .shop-body{display:block}
.details{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px}
.detail strong{display:block;font-size:12px;color:var(--muted)}.notes{margin-top:10px;padding:10px;background:#f8fafc;border-radius:8px;font-size:13px}
.shop-photo{width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-bottom:12px}
.tag{padding:5px 10px;border-radius:20px;font-size:12px;font-weight:bold;display:inline-block}
.tag.hot{background:#dcfce7;color:#15803d}
.tag.warm{background:#e0f2fe;color:#0369a1}
.tag.hesitant{background:#fef3c7;color:#b45309}
.tag.cold{background:#fee2e2;color:#b91c1c}
@media(max-width:800px){.stats-grid{grid-template-columns:1fr}.details{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">FIAUSSÉ — Administration</div><div class="sub">Tableau de bord de prospection & Répartition de l'intérêt</div></div></header>

<main class="wrap">

<div class="stats-grid">
  <div class="kpi-boxes">
    <div class="stat"><div id="total" class="num">0</div><div class="lbl">Boutiques prospectées</div></div>
    <div class="stat"><div id="recent" class="num">0</div><div class="lbl">Réponses aujourd'hui</div></div>
    <div class="stat"><div id="interestedCount" class="num" style="color:#16a34a">0</div><div class="lbl">Boutiques chaudes (Très intéressées)</div></div>
    <div class="stat"><div id="discussCount" class="num" style="color:#0284c7">0</div><div class="lbl">À recontacter (À discuter)</div></div>
  </div>

  <div class="chart-card">
    <div style="font-size:13px;font-weight:800;color:var(--muted);margin-bottom:10px;">Répartition par Intérêt</div>
    <div class="chart-container">
      <canvas id="interestChart"></canvas>
    </div>
  </div>
</div>

<div class="toolbar">
<input id="search" placeholder="Rechercher une boutique, gérant, quartier, téléphone...">
<button id="export" class="btn secondary" type="button">Exporter CSV</button>
</div>

<div id="list" class="shop-list"></div>
</main>

<script>
(function(){
"use strict";
var SUPABASE_URL = "https://jbxebdpurxeojyjcprpg.supabase.co";
var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpieGViZHB1cnhlb2p5amNwcnBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExOTM3MjksImV4cCI6MjEwNjc2OTcyOX0.fNtNTeDCAzYKZzcJMWnPKNPjqO_SRUZ3W6tcA0LdesI" ; // <-- Insérer la clé publiable

var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
var shops = [];
var chartInstance = null;
var $ = function(id){return document.getElementById(id);};

async function load(){
  var res = await sb.from("boutiques").select("*").order("created_at", { ascending: false });
  if(!res.error){ shops = res.data || []; render(); updateChart(); }
}

function updateChart(){
  var counts = { "Très intéressé": 0, "À discuter": 0, "Hésitant": 0, "Pas intéressé": 0, "Non précisé": 0 };
  
  shops.forEach(function(x){
    var k = x.niveau_interet || "Non précisé";
    if(counts[k] !== undefined) counts[k]++;
    else counts["Non précisé"]++;
  });

  $("interestedCount").textContent = counts["Très intéressé"];
  $("discussCount").textContent = counts["À discuter"];

  var ctx = $("interestChart").getContext("2d");
  if(chartInstance) chartInstance.destroy();

  chartInstance = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ['Très intéressé', 'À discuter', 'Hésitant', 'Pas intéressé', 'Non précisé'],
      datasets: [{
        data: [counts["Très intéressé"], counts["À discuter"], counts["Hésitant"], counts["Pas intéressé"], counts["Non précisé"]],
        backgroundColor: ['#22c55e', '#3b82f6', '#f59e0b', '#ef4444', '#94a3b8'],
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } }
    }
  });
}

function getTagClass(interet){
  if(interet === "Très intéressé") return "tag hot";
  if(interet === "À discuter") return "tag warm";
  if(interet === "Hésitant") return "tag hesitant";
  if(interet === "Pas intéressé") return "tag cold";
  return "tag";
}

function render(){
  $("total").textContent = shops.length;
  var today = new Date().toISOString().split('T')[0];
  $("recent").textContent = shops.filter(x => x.date === today).length;

  var q = $("search").value.toLowerCase();
  var data = shops.filter(x => !q || JSON.stringify(x).toLowerCase().includes(q));

  if(!data.length){ $("list").innerHTML = '<div class="card">Aucune boutique enregistrée.</div>'; return; }

  $("list").innerHTML = data.map(x => `
    <article class="shop" id="shop-${x.id}" onclick="document.getElementById('shop-${x.id}').classList.toggle('open')">
      <div class="head">
        <div>
          <div class="name">${x.name || 'Sans nom'}</div>
          <div class="meta">📍 ${x.location || '—'} | 👤 ${x.manager || '—'} (<a href="https://wa.me/${(x.phone||'').replace(/\s+/g,'')}" target="_blank" onclick="event.stopPropagation()">${x.phone || '—'}</a>)</div>
        </div>
        <span class="${getTagClass(x.niveau_interet)}">${x.niveau_interet || 'Non spécifié'}</span>
      </div>
      <div class="shop-body">
        ${x.photo ? `<img src="${x.photo}" class="shop-photo">` : ''}
        <div class="details">
          <div class="detail"><strong>Catégorie :</strong>${x.category || '—'}</div>
          <div class="detail"><strong>Canal actuel :</strong>${x.canaux_vente || '—'}</div>
          <div class="detail"><strong>Vidéo :</strong>${x.capacite_video || '—'}</div>
          <div class="detail"><strong>Modèle préféré :</strong>${x.budget_souhaite || '—'}</div>
          <div class="detail" style="grid-column:1/-1"><strong>GPS :</strong>${x.gps ? `<a href="https://maps.google.com/?q=${x.gps}" target="_blank">🗺️ Voir la position sur Google Maps</a>` : '—'}</div>
        </div>
        <div class="notes"><strong>🚨 Difficultés / Freins :</strong><br>${x.freins_commerciaux || ''}<br>${x.principales_difficultes || ''}</div>
        <div class="notes"><strong>🎯 Attentes FIAUSSÉ :</strong><br>${x.attentes_solution || '—'}</div>
      </div>
    </article>
  `).join("");
}

$("search").oninput = render;
$("export").onclick = function(){
  var csv = "\ufeff" + "Nom;Gérant;Téléphone;Quartier;Catégorie;Intérêt;Difficultés;Attentes\n" + 
    shops.map(x => `"${x.name}";"${x.manager}";"${x.phone}";"${x.location}";"${x.category}";"${x.niveau_interet}";"${x.principales_difficultes}";"${x.attentes_solution}"`).join("\n");
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv"}));
  a.download = "prospection_boutiques.csv"; a.click();
};

load();
})();
</script>
</body>
</html>
